<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">📋 Panel ABC (Nube)</h1>

        <!-- Formulario de Alta / Cambio -->
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-6">
            <h2 id="form-title" class="text-xl font-semibold mb-4 text-gray-700">Agregar Nuevo Producto</h2>
            <form id="producto-form" action="/alta" method="POST" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Nombre del Producto</label>
                        <input type="text" id="nombre" name="nombre" required class="w-full p-3 border rounded-xl text-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Precio ($)</label>
                        <input type="number" step="0.01" id="precio" name="precio" required class="w-full p-3 border rounded-xl text-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div class="flex gap-2">
                    <button type="submit" id="btn-submit" class="w-full bg-blue-600 text-white p-3 rounded-xl font-medium text-lg active:scale-95 transition">Guardar Producto</button>
                    <button type="button" id="btn-cancelar" onclick="resetearFormulario()" class="hidden bg-gray-400 text-white p-3 rounded-xl font-medium text-lg">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Tabla de Registros adaptada a Tablet -->
        <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200">
                            <th class="p-4 font-semibold text-gray-600">ID</th>
                            <th class="p-4 font-semibold text-gray-600">Producto</th>
                            <th class="p-4 font-semibold text-gray-600">Precio</th>
                            <th class="p-4 text-center font-semibold text-gray-600">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        {% for p in productos %}
                        <tr class="hover:bg-gray-50 transition">
                            <td class="p-4 text-gray-500 font-medium">#{{ p.id }}</td>
                            <td class="p-4 text-gray-900 font-medium">{{ p.nombre }}</td>
                            <td class="p-4 text-blue-600 font-semibold">${{ p.precio }}</td>
                            <td class="p-4 flex justify-center gap-3">
                                <!-- Botón de Modificar (Cambio) -->
                                <button onclick="cargarDatos('{{ p.id }}', '{{ p.nombre }}', '{{ p.precio }}')" class="bg-amber-100 text-amber-700 px-4 py-2 rounded-xl font-medium active:scale-90 transition">Editar</button>
                                <!-- Botón de Eliminar (Baja) -->
                                <a href="/baja/{{ p.id }}" onclick="return confirm('¿Eliminar este registro?')" class="bg-red-100 text-red-700 px-4 py-2 rounded-xl font-medium active:scale-90 transition">Eliminar</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script en JS para manejar el comportamiento táctil de edición -->
    <script>
        function cargarDatos(id, nombre, precio) {
            document.getElementById('form-title').innerText = "Modificar Producto #" + id;
            document.getElementById('nombre').value = nombre;
            document.getElementById('precio').value = precio;
            
            const form = document.getElementById('producto-form');
            form.action = "/cambio/" + id;
            
            document.getElementById('btn-submit').innerText = "Actualizar Cambios";
            document.getElementById('btn-submit').className = "w-full bg-amber-500 text-white p-3 rounded-xl font-medium text-lg";
            document.getElementById('btn-cancelar').classList.remove('hidden');
        }

        function resetearFormulario() {
            document.getElementById('form-title').innerText = "Agregar Nuevo Producto";
            document.getElementById('nombre').value = "";
            document.getElementById('precio').value = "";
            document.getElementById('producto-form').action = "/alta";
            document.getElementById('btn-submit').innerText = "Guardar Producto";
            document.getElementById('btn-submit').className = "w-full bg-blue-600 text-white p-3 rounded-xl font-medium text-lg";
            document.getElementById('btn-cancelar').add('hidden');
        }
    </script>
</body>
</html>
